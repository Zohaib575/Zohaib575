<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Winter Arc 2026</title><style>
:root{--bg:#071019;--p:#101f2e;--line:#263b50;--t:#edf5fb;--m:#8ca2b7;--a:#67e8f9;--g:#34d399;--r:#fb7185}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,sans-serif}main{max-width:680px;margin:auto;padding:16px}.top{position:sticky;top:0;background:#071019ee;backdrop-filter:blur(14px);padding:12px 0;z-index:5}.brand{display:flex;justify-content:space-between;align-items:center}.brand h1{font-size:19px;margin:0}.muted{color:var(--m);font-size:12px}.card{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0}.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}.btn{border:1px solid var(--line);background:#0b1824;color:var(--t);border-radius:10px;padding:10px 13px}.btn:disabled{opacity:.4}.date{text-align:center}.date b{font-size:22px;display:block}.progress{height:8px;background:#172738;border-radius:9px;overflow:hidden;margin:12px 0}.fill{height:100%;background:linear-gradient(90deg,var(--a),#a78bfa);width:0}.cat-title{font-size:19px;font-weight:800}.habit{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid #203346}.habit:first-child{border-top:0}.name{font-weight:700}.status{font-size:10px;color:var(--m);margin-top:3px}.checks{display:flex;gap:7px}.check{width:43px;height:43px;border-radius:11px;border:1px solid var(--line);background:#091520;color:#72899d;font-size:18px;font-weight:900}.done.active{color:var(--g);border-color:var(--g);background:#0d3029}.miss.active{color:var(--r);border-color:var(--r);background:#32161f}.quote{font-size:13px;line-height:1.5;color:#cbd8e3}.smallnav{font-size:11px;color:var(--m);text-align:center}.custom{display:grid;gap:8px}.row{display:flex;gap:8px}.row input{flex:1;min-width:0;background:#091520;color:var(--t);border:1px solid var(--line);border-radius:9px;padding:9px}.danger{color:#fecdd3}.hidden{display:none}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:11px;border:1px solid var(--line);border-radius:11px}.stat b{font-size:20px;display:block}.stat span{font-size:10px;color:var(--m)}@media(max-width:430px){main{padding:10px}.check{width:40px;height:40px}.habit{padding:10px 0}}</style></head><body><main>
<div class="top"><div class="brand"><div><h1>Winter Arc 2026–27</h1><div class="muted">Oct 1, 2026 → Jan 31, 2027</div></div><button class="btn" id="custom">Customize</button></div></div>
<div class="card date"><div class="nav"><button class="btn" id="pd">‹</button><div><b id="dn"></b><div class="muted" id="dow"></div><div class="smallnav" id="dp"></div></div><button class="btn" id="nd">›</button></div><div class="progress"><div class="fill" id="df"></div></div><div class="muted"><span id="pct">0</span>% complete</div></div>
<div class="card"><div class="nav"><button class="btn" id="pc">‹</button><div class="date"><div class="cat-title" id="cn"></div><div class="smallnav" id="cp"></div></div><button class="btn" id="nc">›</button></div><div id="habits"></div></div>
<div class="card"><div class="summary"><div class="stat"><b id="done">0</b><span>Done</span></div><div class="stat"><b id="miss">0</b><span>Missed</span></div></div><div class="quote" id="quote"></div></div>
<div id="customPanel" class="card hidden"><div class="nav"><b>Customize</b><button class="btn" id="close">Close</button></div><p class="muted">Add categories and subcategories. Changes save on this device.</p><div class="row"><input id="newcat" placeholder="New category"><button class="btn" id="addcat">Add</button></div><div id="cats" class="custom"></div><div class="row" style="margin-top:12px"><button class="btn" id="save">Save setup</button><button class="btn danger" id="defaults">Restore defaults</button></div></div>
</main><script>
const KEY='winter_arc_mobile_v4',SET='winter_arc_setup_v4';const quotes=['Small steps every day build strong habits.','Discipline gets easier when you repeat it.','Do the work you promised yourself.','Your future is shaped by what you do today.','Consistency beats intensity when intensity is rare.','Finish today before worrying about tomorrow.'];const defs=[['Fitness',['Pushups','Pullups','Squats','Running','Workout']],['Study',['University Course','DSA','Development','Communication Skill']],['Prayers',['Fajr','Dhuhr','Asr','Maghrib','Isha']],['Discipline',['Wake Early','Sleep on Time','Water','Reading','Screen Limit','Room / Desk']],['P / M',['P','M']]];
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);let cats=loadCats(),state=JSON.parse(localStorage.getItem(KEY)||'{}'),di=0,ci=0,edit=[];
function loadCats(){try{let x=JSON.parse(localStorage.getItem(SET));if(Array.isArray(x)&&x.length)return x}catch{}return defs.map(([n,it])=>({id:uid(),name:n,items:it.map(x=>({id:uid(),name:x}))}))}
function save(){localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem(SET,JSON.stringify(cats))}
const dates=[];for(let d=new Date('2026-10-01T12:00:00');d<=new Date('2027-01-31T12:00:00');d.setDate(d.getDate()+1))dates.push(new Date(d));const key=d=>d.toISOString().slice(0,10);
function dayState(){return state[key(dates[di])]||{}}
function habits(){return cats.flatMap(c=>c.items)}
function render(){const d=dates[di],c=cats[ci]||cats[0],s=dayState();document.getElementById('dn').textContent=d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});document.getElementById('dow').textContent=d.toLocaleDateString(undefined,{weekday:'long'});document.getElementById('dp').textContent='Day '+(di+1)+' / '+dates.length;document.getElementById('cn').textContent=c?c.name:'No categories';document.getElementById('cp').textContent=c?'Category '+(ci+1)+' / '+cats.length:'0 / 0';let total=habits().length,done=0,miss=0;c?.items.forEach(i=>{const v=s[i.id]||0;if(v===1)done++;if(v===-1)miss++});habits().forEach(i=>{const v=s[i.id]||0;if(v===1)done++;if(v===-1)miss++});document.getElementById('done').textContent=Object.values(s).filter(v=>v===1).length;document.getElementById('miss').textContent=Object.values(s).filter(v=>v===-1).length;const pct=total?Math.round(Object.values(s).filter(v=>v===1).length/total*100):0;document.getElementById('pct').textContent=pct;document.getElementById('df').style.width=pct+'%';document.getElementById('quote').textContent='“'+quotes[di%quotes.length]+'”';const h=document.getElementById('habits');h.innerHTML=c?c.items.map(i=>{const v=s[i.id]||0;return '<div class="habit"><div><div class="name">'+esc(i.name)+'</div><div class="status">'+(v===1?'Done':v===-1?'Missed':'Not marked')+'</div></div><div class="checks"><button class="check done '+(v===1?'active':'')+'" data-id="'+i.id+'" data-v="1">✓</button><button class="check miss '+(v===-1?'active':'')+'" data-id="'+i.id+'" data-v="-1">✕</button></div></div>'}).join(''):'<div class="muted">Add a category to begin.</div>';h.querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=key(d),id=b.dataset.id,v=+b.dataset.v;state[k]??={};state[k][id]=state[k][id]===v?0:v;save();render()})}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function manager(){document.getElementById('cats').innerHTML=edit.map((c,x)=>'<div class="card"><div class="row"><input value="'+esc(c.name)+'" data-c="'+x+'"><button class="btn danger" data-delc="'+x+'">Delete</button></div><div class="custom">'+c.items.map((i,y)=>'<div class="row"><input value="'+esc(i.name)+'" data-i="'+x+':'+y+'"><button class="btn danger" data-deli="'+x+':'+y+'">Delete</button></div>').join('')+'</div><button class="btn" data-add="'+x+'" style="margin-top:8px">+ Subcategory</button></div>').join('');document.querySelectorAll('[data-c]').forEach(e=>e.oninput=()=>edit[e.dataset.c].name=e.value);document.querySelectorAll('[data-i]').forEach(e=>e.oninput=()=>{let[a,b]=e.dataset.i.split(':').map(Number);edit[a].items[b].name=e.value});document.querySelectorAll('[data-add]').forEach(e=>e.onclick=()=>{edit[e.dataset.add].items.push({id:uid(),name:'New subcategory'});manager()});document.querySelectorAll('[data-delc]').forEach(e=>e.onclick=()=>{edit.splice(+e.dataset.delc,1);manager()});document.querySelectorAll('[data-deli]').forEach(e=>e.onclick=()=>{let[a,b]=e.dataset.deli.split(':').map(Number);edit[a].items.splice(b,1);manager()})}
document.getElementById('pd').onclick=()=>{if(di>0)di--;render()};document.getElementById('nd').onclick=()=>{if(di<dates.length-1)di++;render()};document.getElementById('pc').onclick=()=>{if(ci>0)ci--;render()};document.getElementById('nc').onclick=()=>{if(ci<cats.length-1)ci++;render()};document.getElementById('custom').onclick=()=>{edit=JSON.parse(JSON.stringify(cats));document.getElementById('customPanel').classList.remove('hidden');manager()};document.getElementById('close').onclick=()=>document.getElementById('customPanel').classList.add('hidden');document.getElementById('addcat').onclick=()=>{let n=document.getElementById('newcat').value.trim();if(n){edit.push({id:uid(),name:n,items:[{id:uid(),name:'New subcategory'}]});document.getElementById('newcat').value='';manager()}};document.getElementById('save').onclick=()=>{cats=edit.filter(c=>c.items.length);save();ci=Math.min(ci,Math.max(0,cats.length-1));document.getElementById('customPanel').classList.add('hidden');render()};document.getElementById('defaults').onclick=()=>{cats=defs.map(([n,it])=>({id:uid(),name:n,items:it.map(x=>({id:uid(),name:x}))}));save();edit=JSON.parse(JSON.stringify(cats));manager();render()};render();
</script></body></html>
