plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.winterarc.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.winterarc.app'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '1.0.3'
    }

    buildFeatures { buildConfig true }
}

kotlin { jvmToolchain(17) }
